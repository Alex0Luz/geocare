function addRaster(L, d) {

/* ---------------- data drawn as points and lines ---------------- */
const getJSON = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };

async function loadTracks() {

function popup(f, lngLat) {

  state.marker.setLngLat([lon, lat]).addTo(map);
  const me = { name: "" }, pop = (asking = new maplibregl.Popup({ closeButton: false, offset: 34 }).setLngLat([lon, lat]).setHTML(`<b id="askn">${t("p_here")}</b><br><span style="color:#5d6b63">${lat.toFixed(2)}, ${lon.toFixed(2)}</span><br><button type="button">${t("p_see")} →</button>`).addTo(map));
  pop.getElement().querySelector("button").onclick = () => { pop.remove(); hand(lat, lon, me.name); };
  getJSON(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=jsonv2&zoom=10&accept-language=${lang}`).then((j) => { if (!j.address) return; const a = j.address, n = [a.city || a.town || a.village || a.municipality || a.county || a.state_district, a.state, a.country].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).slice(0, 3).join(", "); if (n) { me.name = n; const e = pop.getElement() && pop.getElement().querySelector("#askn"); if (e) e.textContent = n; } }).catch(() => {});
}
map.on("click", (e) => {
  const f = map.queryRenderedFeatures([[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]], { layers: CLICK.filter((i) => map.getLayer(i)) })[0];
  if (f) { popup(f, e.lngLat); return; }
  if (EMBED) ask(e.lngLat.lat, e.lngLat.lng); else pick(e.lngLat.lat, e.lngLat.lng, "");
});
// the app tells the planet which language to speak and where its place is
if (EMBED) addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "geocare-lang" && TXT[e.data.lang]) { lang = e.data.lang; words(); }
  if (e.data.type === "geocare-goto" && Number.isFinite(+e.data.lat) && Number.isFinite(+e.data.lon)) { state.spin = false; if (!state.marker) state.marker = new maplibregl.Marker({ color: "#b5452c" }); state.marker.setLngLat([+e.data.lon, +e.data.lat]).addTo(map); map.flyTo({ center: [+e.data.lon, +e.data.lat], zoom: Math.max(map.getZoom(), 5), duration: 1800, essential: true }); }
});
// the Earth turns slowly until someone touches it
["mousedown", "touchstart", "wheel", "keydown"].forEach((ev) => addEventListener(ev, () => (state.spin = false), { passive: true }));
(function turn() { if (state.spin && map.loaded() && !document.hidden) { const c = map.getCenter(); map.jumpTo({ center: [c.lng + 0.05, c.lat] }); } if (state.spin) requestAnimationFrame(turn); })();
addEventListener("resize", sizeCanvas);
</script>
