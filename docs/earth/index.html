// The newest day a layer has: try the usual day and then earlier ones, by loading its single world tile.
function newestDay(L) {
  return new Promise((res) => {
    let k = L.back; const tryOne = () => {
      if (k > L.back + 7) return res(day(L.back));
      const d = day(k), im = new Image(); im.crossOrigin = "anonymous";
      im.onload = () => res(d); im.onerror = () => { k++; tryOne(); };
      im.src = tileUrl(L, d).replace("{z}", 0).replace("{y}", 0).replace("{x}", 0);

  });
}

$("#ltoggle").onclick = () => $("#layers").classList.toggle("show");
$("#search").addEventListener("submit", async (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (!q) return;
  try { const j = await getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=jsonv2&limit=1&accept-language=${lang}`); if (!j.length) { $("#q").value = ""; $("#q").placeholder = t("notfound"); return; }
    const lat = +j[0].lat, lon = +j[0].lon; state.spin = false; map.flyTo({ center: [lon, lat], zoom: 9, duration: 3200, essential: true }); pick(lat, lon, j[0].display_name.split(",").slice(0, 3).join(",")); $("#q").blur(); } catch (_) { $("#q").placeholder = t("notfound"); } });

map.on("load", async () => {
  sizeCanvas(); words();
  for (const L of LAYERS) if (state.on[L.id]) setLayer(L.id, true);
  getJSON("../data/cascades.json").then((j) => { state.cascades = j.cascades; if (state.picked && state.picked.year) $("#pcasc").innerHTML = cascadesFor(state.picked.year); }).catch(() => {});
  if (hasStart) pick(start[1], start[0], qs.get("name") || "");
  setTimeout(() => $("#hint").classList.add("off"), 9000);
});
map.on("click", (e) => {
  const f = map.queryRenderedFeatures(e.point, { layers: ["events", "quakes", "cases"].filter((i) => map.getLayer(i)) })[0];
  if (f) { popup(f, e.lngLat); return; }
  pick(e.lngLat.lat, e.lngLat.lng, "");
});
// the Earth turns slowly until someone touches it
["mousedown", "touchstart", "wheel", "keydown"].forEach((ev) => addEventListener(ev, () => (state.spin = false), { passive: true }));
(function turn() { if (state.spin && map.loaded()) { const c = map.getCenter(); map.jumpTo({ center: [c.lng + 0.06, c.lat] }); } if (state.spin) requestAnimationFrame(turn); })();
addEventListener("resize", () => { sizeCanvas(); });
</script>
</body>
</html>
