<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoCare · Climate & Health where you are</title>
<meta name="description" content="Climate trends, health consequences and community help for any address on Earth. NASA Space Apps Challenge 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">◐</span>
        <div><h1>GeoCare</h1><p data-i18n="app.tagline"></p></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="pt">PT</button>
      </div>
    </header>

    <form id="search-form" class="search">
      <input id="q" data-i18n-ph="search.placeholder" autocomplete="off" aria-label="Address">
      <button class="btn" data-i18n="search.go"></button>
      <button type="button" class="btn ghost icon" id="gps" title="GPS" aria-label="Use my location">⌖</button>
    </form>
    <p id="status" class="status" role="status"></p>

    <nav class="tabs">
      <button class="tab on" data-tab="place" data-i18n="tab.place"></button>
      <button class="tab" data-tab="health" data-i18n="tab.health"></button>
      <button class="tab" data-tab="now" data-i18n="tab.now"></button>
      <button class="tab" data-tab="prepare" data-i18n="tab.prepare"></button>
      <button class="tab" data-tab="community" data-i18n="tab.community"></button>
      <button class="tab" data-tab="region" data-i18n="tab.region"></button>
      <button class="tab" data-tab="act" data-i18n="tab.act"></button>
      <button class="tab" data-tab="world" data-i18n="tab.world"></button>
      <button class="tab" data-tab="compare" data-i18n="tab.compare"></button>
    </nav>

    <main class="panels">
      <section class="panel on" id="p-place"></section>
      <section class="panel" id="p-health"></section>
      <section class="panel" id="p-now"></section>
      <section class="panel" id="p-community"></section>
      <section class="panel" id="p-region"></section>
      <section class="panel" id="p-act"></section>
      <section class="panel" id="p-prepare"></section>
      <section class="panel" id="p-world"></section>
      <section class="panel" id="p-compare"></section>
    </main>
    <footer class="foot-note" data-i18n="footer.note"></footer>
  </aside>
  <div id="map" aria-label="Map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/stats.js"></script>
<script src="js/extra.js"></script>
<script src="js/extra2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
