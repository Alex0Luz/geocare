<style>

  :root { --sand: #f6f1e7; --paper: #fffdf8; --ink: #1c2a24; --muted: #5d6b63; --line: #e2d9c8; --earth: #b5452c; --mark: #f3d9a4; --r: 18px; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  /* dark background, for screens that wash out light colours: press D or add ?theme=dark */
  :root.dark { --sand: #121c18; --paper: #1b2823; --ink: #f4eee1; --muted: #a8b4ac; --line: #35463e; --earth: #f2895c; --mark: #70491a; }

  .dark .shot, .dark .crop img, .dark .scroll img { filter: brightness(0.9); }
  .dark .map .lab { background: #f4eee1; color: #121c18; } .dark .map .pin { background: #121c18; box-shadow: 0 0 0 4px #f4eee1; } .dark .map .pin::after { border-color: #f4eee1; }
  * { box-sizing: border-box; }

  body { font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .slide { position: absolute; inset: 0; padding: 84px 108px 76px; opacity: 0; visibility: hidden; transform: translateX(28px); transition: opacity 0.5s var(--ease), transform 0.7s var(--ease), visibility 0s 0.5s; }
  .slide.on { opacity: 1; visibility: visible; transform: none; transition: opacity 0.6s var(--ease) 0.08s, transform 0.8s var(--ease) 0.08s; }
  .slide.past { transform: translateX(-28px); }
  h1, h2, .big, .num { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .q { font-size: 68px; line-height: 1.04; max-width: 1180px; text-wrap: balance; }
  .a { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 52px; line-height: 1.08; color: var(--earth); margin: 18px 0 0; text-wrap: balance; }
  p { margin: 0; }
  .lead { font-size: 27px; line-height: 1.42; color: var(--ink); max-width: 30em; }
  .small { font-size: 21px; line-height: 1.45; color: var(--muted); }
  .hl { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 94%, transparent 94%); background-repeat: no-repeat; background-size: 0% 100%; transition: background-size 0.9s var(--ease) 0.5s; padding: 0 2px; }
  .in .hl, .on .hl.now { background-size: 100% 100%; }

  /* things that enter: on the slide itself (.e) or on a later press (data-f) */
  .e, [data-f] { opacity: 0; transform: translateY(22px); transition: opacity 0.7s var(--ease), transform 0.9s var(--ease); transition-delay: calc(var(--i, 0) * 0.16s); }
  .slide.on .e, .slide.on [data-f].in { opacity: 1; transform: none; }
  .slide.on .e { transition-delay: calc(0.25s + var(--i, 0) * 0.16s); }
  .shot { display: block; width: 100%; height: auto; border-radius: var(--r); border: 1px solid var(--line); background: var(--paper); box-shadow: 0 18px 40px -22px rgba(92, 58, 28, 0.45); }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 1 cover */
  #s1 { display: grid; grid-template-columns: 1fr 610px; gap: 64px; align-items: center; }
  .brand { font-size: 112px; letter-spacing: -0.035em; line-height: 0.92; }
  .tag { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 46px; line-height: 1.14; letter-spacing: -0.015em; margin-top: 26px; max-width: 15em; text-wrap: balance; }
  .team { margin-top: 58px; display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0 54px; }
  .team .th { grid-column: 1 / -1; font-size: 19px; font-weight: 700; color: var(--earth); margin-bottom: 14px; }
  .who b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 38px; letter-spacing: -0.01em; }
  .who span { display: block; font-size: 22px; color: var(--muted); margin-top: 2px; }
  .who i { display: block; font-style: normal; font-weight: 700; font-size: 23px; margin-top: 8px; }
  .chal { margin-top: 44px; }
  .map { position: relative; width: 566px; margin-bottom: 96px; justify-self: end; aspect-ratio: 640 / 700; }
  .map img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .fr { opacity: 0; transition: opacity 0.9s linear; }
  .map .fr.show { opacity: 1; }
  .map .pin { position: absolute; left: 60.6%; top: 54.7%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--paper); }
  .map .pin::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ink); animation: ping 2.4s var(--ease) infinite; }
  .map .lab { position: absolute; left: calc(60.6% + 18px); top: calc(54.7% - 15px); font-weight: 700; font-size: 19px; background: var(--paper); padding: 2px 9px; border-radius: 8px; }
  .map .month { position: absolute; left: 0; bottom: -70px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 54px; letter-spacing: -0.02em; text-transform: capitalize; }
  .map .cap { position: absolute; left: 0; bottom: -96px; white-space: nowrap; font-size: 17px; color: var(--muted); }
  .scale { position: absolute; right: 0; bottom: -50px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .scale u { display: block; width: 110px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #f3ead6, #f2d3a2, #e6a155, #cf6a30, #a53c22, #6e2414); }
  @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }

  /* 2 the problem */
  #s2 .cols { display: grid; grid-template-columns: 450px 1fr; gap: 80px; margin-top: 56px; align-items: start; }
  .note { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 30px 34px 32px; transform: rotate(-1.4deg); box-shadow: 0 22px 44px -26px rgba(92, 58, 28, 0.5); }
  .note .nm { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 34px; margin-bottom: 14px; }
  .note li { font-size: 28px; line-height: 1.3; padding: 9px 0; border-top: 1px dashed var(--line); list-style: none; }
  .note ul { margin: 0; padding: 0; }
  #s2 .a { font-size: 46px; }
  #s2 .big { font-size: 66px; line-height: 1.06; margin-top: 36px; text-wrap: balance; }
  .haz { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-top: 44px; font-size: 27px; font-weight: 600; }
  .haz span { display: inline-flex; align-items: center; gap: 9px; }
  .haz .ic { font-size: 30px; color: var(--earth); }

  /* 3 why it is a problem */
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 30px; }
  #s3 .a { font-size: 44px; margin-top: 10px; }
  .versus > div { padding: 4px 56px 4px 0; }
  .versus > div + div { padding: 4px 0 4px 56px; border-left: 1px solid var(--line); }
  .vt { font-size: 20px; font-weight: 700; color: var(--muted); margin-bottom: 18px; }
  .jargon { display: flex; flex-wrap: wrap; gap: 10px 12px; font: 600 22px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); }
  .jargon span { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 10px 13px; }
  .vc { font-size: 24px; line-height: 1.38; margin-top: 14px; }
  .nada { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 76px; line-height: 0.95; letter-spacing: -0.03em; color: var(--earth); }
  .late { margin-top: 26px; }
  .late .lt { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -0.02em; }
  .track { position: relative; height: 16px; border-radius: 8px; background: var(--line); margin: 56px 0 14px; }
  .track b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 8px; background: var(--ink); transition: width 2.6s linear 0.6s; }
  .in .track b { width: 93%; }
  .track .stop { position: absolute; top: -46px; transform: translateX(-50%); font-size: 20px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity 0.5s var(--ease) 3.1s; }
  .track .stop::after { content: ""; position: absolute; left: 50%; top: 30px; width: 2px; height: 38px; background: currentColor; }
  .track .stop.w { left: 93%; color: var(--earth); }
  .track .stop.w { transform: translateX(-100%); } .track .stop.w::after { left: auto; right: 0; }
  .track .stop.d { left: 100%; top: 34px; transform: translateX(-100%); transition-delay: 3.5s; }
  .track .stop.d::after { left: auto; right: 0; top: -34px; height: 30px; }
  .in .track .stop { opacity: 1; }
  .ends { display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; color: var(--muted); margin-top: 50px; }
  .ends .hl { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 34px; color: var(--ink); letter-spacing: -0.015em; }

  /* 4 how it works */
  #s4 .grid { display: grid; grid-template-columns: 590px 1fr; gap: 26px 64px; margin-top: 36px; align-items: start; }
  .step { display: grid; grid-template-columns: 54px 1fr; gap: 6px 16px; align-items: start; }
  .step .n { width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 27px; }
  .step h3 { margin: 6px 0 0; font-family: "Bricolage Grotesque", sans-serif; font-size: 34px; line-height: 1.1; letter-spacing: -0.015em; }
  .step p { grid-column: 2; font-size: 22px; color: var(--muted); line-height: 1.4; }
  .step .shot { grid-column: 2; margin-top: 10px; }
  .crop { grid-column: 2; margin-top: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 18px 40px -22px rgba(92, 58, 28, 0.45); }
  .crop img { display: block; width: 100%; }
  #s4 .left { display: grid; gap: 30px; }
  #s4 .right .crop { height: 470px; }
  .foot { margin: 22px 0 0 70px; font-size: 23px; line-height: 1.4; color: var(--muted); }
  .foot b { color: var(--ink); }

  /* 5 why it is the solution */
  #s5 .grid { display: grid; grid-template-columns: 480px 1fr 350px; gap: 50px; margin-top: 34px; align-items: start; }
  .cares { margin: 26px 0 0; padding: 0; list-style: none; }
  .cares li { display: flex; gap: 14px; align-items: baseline; font-size: 30px; line-height: 1.3; font-weight: 600; padding: 15px 0; border-top: 1px solid var(--line); }
  .cares .ic { font-size: 26px; color: var(--earth); transform: translateY(4px); }
  .ct { font-size: 22px; color: var(--muted); margin-top: 34px; }
  .scroll { height: 590px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 18px 40px -22px rgba(92, 58, 28, 0.45); }
  .scroll img { display: block; width: 100%; }
  .slide.on .in .scroll img { animation: pan 16s ease-in-out 1.2s infinite alternate; }
  @keyframes pan { from { transform: translateY(0); } to { transform: translateY(calc(-100% + 590px)); } }
  .gt { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 27px; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 14px; }

  /* 6 what makes us different */
  #s6 .grid { display: grid; grid-template-columns: 1fr 420px; gap: 64px; align-items: start; }
  #s6 .a { font-size: 58px; line-height: 1.02; margin-top: 14px; }
  #s6 .haz { margin-top: 26px; font-size: 30px; gap: 14px 36px; }
  #s6 .haz .ic { font-size: 34px; }
  #s6 .lead { font-size: 28px; margin-top: 22px; max-width: 26em; }

  .care .a2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 50px; line-height: 1.04; letter-spacing: -0.02em; color: var(--earth); }
  .who5 { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 20px; }
  .who5 span { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 9px 20px; font-size: 27px; font-weight: 600; }
  #s6 .crop { margin-top: 0; }
  #s6 .crop.g { height: 330px; } #s6 .crop.y { height: 330px; margin-top: 18px; }

  /* 7 close */
  #s7 { display: grid; grid-template-columns: 1fr 470px; gap: 80px; align-items: center; }
  .next { font-size: 21px; font-weight: 700; color: var(--earth); }
  .nextt { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.15; letter-spacing: -0.015em; margin-top: 8px; max-width: 16em; }
  #s7 .big { font-size: 78px; line-height: 1.02; margin-top: 50px; text-wrap: balance; }
  .url { display: inline-block; margin-top: 44px; font: 700 30px/1 "Manrope", sans-serif; color: var(--paper); background: var(--ink); padding: 18px 26px; border-radius: var(--r); text-decoration: none; }
  .thanks { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 40px; margin-left: 26px; }
  .fine { margin-top: 44px; font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 46em; }

  #bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--earth); width: 0; transition: width 0.6s var(--ease); }
  #hint { position: absolute; right: 26px; bottom: 18px; font-size: 15px; color: var(--muted); transition: opacity 0.8s; }
  #hint.off { opacity: 0; }
  .blank body { background: #000; } .blank #stage { visibility: hidden; }

  /* every slide and every step on paper: add ?print=1 and print to PDF */
  .print body, .print html { overflow: visible; height: auto; }
  .print #stage { position: static; width: 1600px; height: auto; transform: none !important; }
  .print .slide { position: relative; height: 900px; opacity: 1; visibility: visible; transform: none; page-break-after: always; break-after: page; }
  .print .e, .print [data-f] { opacity: 1 !important; transform: none !important; transition: none !important; }
  .print .hl { background-size: 100% 100%; transition: none; }
  .print .track b { width: 93%; transition: none; } .print .track .stop { opacity: 1; transition: none; }
  .print #bar, .print #hint { display: none; }
  .print .map .fr:first-of-type { opacity: 1; }
  @page { size: 1600px 900px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .slide, .e, [data-f], .hl, .track b, .track .stop, .map .fr { transition-duration: 0.01s !important; transition-delay: 0s !important; } .scroll img, .map .pin::after { animation: none !important; } }
</style>

const q = new URLSearchParams(location.search), PRINT = q.has("print");
let lang = TXT[q.get("lang")] ? q.get("lang") : "es";
const stage = document.getElementById("stage"), slides = [...document.querySelectorAll(".slide")];
const auto = (i) => +slides[i].dataset.auto || 0;
let cur = Math.min(slides.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1)), step = auto(cur);
if (PRINT) document.documentElement.classList.add("print");
function setTheme(dark) { document.documentElement.classList.toggle("dark", dark); try { localStorage.setItem("geocare.pitch.theme", dark ? "dark" : "light"); } catch (_) { /* storage unavailable */ } }
let saved = ""; try { saved = localStorage.getItem("geocare.pitch.theme") || ""; } catch (_) { /* storage unavailable */ }
setTheme((q.get("theme") || saved || "dark") === "dark"); // dark is the standard look; D or ?theme=light gives the light one

function setLang(l) {
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach((e) => { const v = TXT[l][e.dataset.t] ?? ""; if (e.hasAttribute("data-html")) e.innerHTML = v; else e.textContent = v; });
  document.querySelectorAll("[data-img]").forEach((e) => { e.src = `assets/${l}/${e.dataset.img}.webp`; });
  document.getElementById("hint").textContent = TXT[l].hint; month();
}

// the map: twelve months of the same NASA layer, one after the other
const mapBox = document.getElementById("map"), frames = [];
for (let m = 1; m <= 12; m++) { const im = new Image(); im.src = `assets/map/${String(m).padStart(2, "0")}.webp`; im.className = "fr"; im.alt = ""; mapBox.prepend(im); frames.push(im); }
let mi = 0, mapTimer = null;
function month() { frames.forEach((f, i) => f.classList.toggle("show", i === mi)); document.getElementById("month").textContent = new Date(2024, mi, 15).toLocaleDateString(lang, { month: "long" }); }
function mapRun(on) { clearInterval(mapTimer); mapTimer = null; if (on && !PRINT) mapTimer = setInterval(() => { mi = (mi + 1) % 12; month(); }, 1150); }

function show() {
  slides.forEach((s, i) => { s.classList.toggle("on", i === cur || PRINT); s.classList.toggle("past", i < cur); });
  slides[cur].querySelectorAll("[data-f]").forEach((e) => e.classList.toggle("in", step >= +e.dataset.f));
  const presses = (s) => 1 + +s.dataset.steps - (+s.dataset.auto || 0);
  const total = slides.reduce((n, s) => n + presses(s), 0), done = slides.slice(0, cur).reduce((n, s) => n + presses(s), 0) + step - auto(cur) + 1;
  document.getElementById("bar").style.width = (done / total) * 100 + "%";
  history.replaceState(null, "", "#" + (cur + 1));
  mapRun(cur === 0);
}
function count() { const e = document.getElementById("five"); if (e.dataset.done) return; e.dataset.done = 1; let n = 0; e.textContent = 0; const t = setInterval(() => { e.textContent = ++n; if (n >= 5) clearInterval(t); }, 260); }
function go(d) {
  const steps = +slides[cur].dataset.steps;
  if (d > 0) { if (step < steps) step++; else if (cur < slides.length - 1) { cur++; step = auto(cur); } }
  else { if (step > auto(cur)) step--; else if (cur > 0) { cur--; step = +slides[cur].dataset.steps; } }
  document.getElementById("hint").classList.add("off"); show();
}
function fit() { if (PRINT) return; const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(${(innerWidth - 1600 * s) / 2}px, ${(innerHeight - 900 * s) / 2}px) scale(${s})`; }

addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " ", "Enter", "ArrowDown"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp", "Backspace", "ArrowUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key.toLowerCase() === "l") setLang(lang === "es" ? "en" : "es");
  else if (e.key.toLowerCase() === "d") setTheme(!document.documentElement.classList.contains("dark"));
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === "F5") { e.preventDefault(); if (!document.fullscreenElement) document.documentElement.requestFullscreen(); } // the "start" button of a presenter remote
  else if (e.key.toLowerCase() === "b" || e.key === ".") document.documentElement.classList.toggle("blank"); // the "black screen" button of a presenter remote

setLang(lang); fit();
if (PRINT) { slides.forEach((s) => s.querySelectorAll("[data-f]").forEach((e) => e.classList.add("in"))); slides.forEach((s) => s.classList.add("on")); } else { requestAnimationFrame(() => requestAnimationFrame(show)); setTimeout(() => document.getElementById("hint").classList.add("off"), 7000); }
